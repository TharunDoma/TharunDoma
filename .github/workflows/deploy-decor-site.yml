name: Deploy decor site to GitHub Pages

on:
  push:
    branches: ["claude/indian-events-decor-site-jucb4a"]
    paths:
      - "artisans-events-decor/**"
      - ".github/workflows/deploy-decor-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be enabled once by the repo owner:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artisans-events-decor

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
